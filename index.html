<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<title>Sign In · Agent Portal</title><link rel="stylesheet" href="css/style.css"></head>
<body class="login"><div class="login-card">
  <img class="logo big" src="https://managment.io/img/logo.svg" alt="Agent Portal" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;mark&quot;>A</div>'"><p>Sign in to continue</p>
  <form class="login-form" id="f" autocomplete="on">
    <div class="field"><label for="u">Username</label><input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required></div>
    <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" id="go">Sign In</button><div class="err" id="e" role="alert"></div>
  </form></div>
<script src="js/config.js"></script><script src="js/core.js"></script><script src="js/login.js"></script></body></html>
